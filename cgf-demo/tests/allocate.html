<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Allocation tests</title>
<style>
  body { font: 14px/1.5 "Segoe UI", system-ui, sans-serif; background: #0b1420; color: #d6e2f0; padding: 16px; }
  .pass { color: #4dd17a; } .fail { color: #ff7b54; } h1 { font-size: 16px; }
  #summary { font-weight: 700; margin: 8px 0 12px; }
</style>
</head>
<body>
<h1>Allocation tests (contracts, platforms, crews, allocation)</h1>
<div id="summary">running…</div>
<ul id="results"></ul>

<script src="../js/util.js"></script>
<script src="../contracts/contracts.js"></script>
<script src="../fixtures/envelope-default.js"></script>
<script src="../fixtures/platforms.js"></script>
<script src="../fixtures/profiles/roster.js"></script>
<script src="../js/adapt/predict.js"></script>
<script src="../js/ui-allocate-vehicles.js"></script>
<script src="../js/ui-allocate.js"></script>
<script>
(function () {
  const C = CGF.contracts, A = CGF.allocate, F = window.CGF_FIXTURES;
  const results = [];
  const test = (name, fn) => { try { fn(); results.push([name, null]); } catch (e) { results.push([name, e.message]); } };
  const eq = (a, b, msg) => { if (JSON.stringify(a) !== JSON.stringify(b)) throw new Error((msg || 'not equal') + ': got ' + JSON.stringify(a) + ', want ' + JSON.stringify(b)); };
  const ok = (c, msg) => { if (!c) throw new Error(msg || 'expected true'); };
  const near = (a, b) => ok(Math.abs(a - b) < 1e-9, `got ${a}, want ${b}`);
  const clone = o => JSON.parse(JSON.stringify(o));

  const DOMAINS = { 'strait-transit': 'sea', 'sea-air': 'sea', 'border-patrol': 'land', 'airspace-patrol': 'air' };
  const ids = Object.keys(DOMAINS), domainOf = id => DOMAINS[id] || 'sea';
  const ctx = { scenarioIds: ids, domainOf, models: F.platformModels };
  const build = s => A.buildAllocation(s, F.envelopeDefault);
  const cfgs = s => C.expandAllocation(build(s));

  // A ready selection: warship, one crew of three
  const sel = () => ({
    platform: { type: 'warship', model: 'formidable' },
    crews: { A: { weapons: 'trainee_a', sensors: 'trainee_c01', navigation: 'trainee_c02' } },
    agents: { A: { weapons: 'trainees/strong.js', sensors: 'trainees/strong.js', navigation: 'trainees/strong.js' } },
    opts: clone(A.DEFAULTS)
  });
  // The same for any platform type, filled from the roster in order
  function filled(type, model) {
    const s = A.withPlatform(sel(), { type, model }, ids, domainOf), pool = F.profiles.map(p => p.trainee_id);
    let n = 0;
    for (const c of A.SLOTS) for (const seat of A.seatsOf(type)) { s.crews[c][seat] = pool[n++]; s.agents[c][seat] = 'trainees/strong.js'; }
    return s;
  }

  // ---- fixtures
  test('envelope fixture is valid', () => eq(C.validateEnvelope(F.envelopeDefault), []));
  test('every roster profile is valid', () => F.profiles.forEach(p => eq(C.validateProfile(p), [], p.trainee_id)));
  test('roster has 2 demo trainees and 20 cohort trainees', () => eq(F.profiles.length, 22));
  test('trainee ids are unique', () => eq(new Set(F.profiles.map(p => p.trainee_id)).size, F.profiles.length));

  // ---- platform catalog
  test('three platform types with 2, 3 and 2 seats', () => {
    eq(Object.keys(F.platformTypes), ['fighter', 'warship', 'tank']);
    eq(['fighter', 'warship', 'tank'].map(t => F.platformTypes[t].seats.length), [2, 3, 2]);
  });
  test('seat ids in the catalog match the contract', () => {
    for (const t of Object.keys(F.platformTypes)) eq(F.platformTypes[t].seats, C.SEATS_BY_TYPE[t], t);
  });
  test('two models per type, each with a source and a definition for every seat', () => {
    for (const t of Object.keys(F.platformTypes)) {
      const ms = F.platformModels.filter(m => m.type === t);
      eq(ms.length, 2, t);
      ms.forEach(m => {
        ok(/^https:\/\//.test(m.source), m.id + ' source');
        eq(Object.keys(m.seats), C.SEATS_BY_TYPE[t], m.id + ' seats');
        Object.values(m.seats).forEach(d => ok(d.label && d.text, m.id + ' seat text'));
      });
    }
  });
  test('model ids are unique', () => eq(new Set(F.platformModels.map(m => m.id)).size, F.platformModels.length));
  test('every seat has 3 distinct competencies from the catalog, and every catalog competency is used by some seat', () => {
    const used = new Set();
    for (const [t, info] of Object.entries(F.platformTypes)) {
      eq(Object.keys(info.seatFocus), info.seats, t + ' focus seats');
      for (const [seat, list] of Object.entries(info.seatFocus)) {
        eq(list.length, 3, `${t}/${seat} count`);
        eq(new Set(list).size, 3, `${t}/${seat} distinct`);
        list.forEach(k => { ok(C.COMPETENCIES.includes(k), `${t}/${seat}: unknown ${k}`); used.add(k); });
      }
    }
    C.COMPETENCIES.forEach(k => ok(used.has(k), `no seat uses ${k}`));
  });
  test('the competency catalog has 9 entries', () => eq(C.COMPETENCIES.length, 9));

  // ---- mean and evidence
  test('mean is alpha / (alpha + beta)', () => {
    const b = F.profiles.find(p => p.trainee_id === 'trainee_b');
    near(A.summarise(b).hail_discipline.mean, 5 / 19);
    near(A.summarise(b).collision_avoidance.mean, 18 / 24);
  });
  test('evidence flag turns on at alpha + beta >= 8', () => {
    const mk = (a, b) => ({ trainee_id: 't', sessions_completed: 1, competencies: { hail_discipline: { alpha: a, beta: b } }, updated_at_session: null });
    eq(A.summarise(mk(4, 3)).hail_discipline.enough, false);
    eq(A.summarise(mk(4, 4)).hail_discipline.enough, true);
  });
  test('a missing competency falls back to the 1,1 prior with no evidence', () => {
    const c10 = F.profiles.find(p => p.trainee_id === 'trainee_c10');
    const s = A.summarise(c10).weapons_discipline;
    eq([s.alpha, s.beta, s.mean, s.prior, s.enough], [1, 1, 0.5, true, false]);
  });
  test('demo trainee B is weakest at hail, A is not', () => {
    const lowest = id => { const s = A.summarise(F.profiles.find(p => p.trainee_id === id)); return Object.keys(s).sort((x, y) => s[x].mean - s[y].mean)[0]; };
    eq(lowest('trainee_b'), 'hail_discipline');
    ok(lowest('trainee_a') !== 'hail_discipline');
  });

  // ---- validators reject bad data
  test('profile validator rejects an unknown competency and an unknown field', () => {
    const p = clone(F.profiles[0]); p.competencies.bogus = { alpha: 1, beta: 1 }; p.extra = 1;
    eq(C.validateProfile(p).length, 2);
  });
  test('envelope validator rejects min > base and out-of-range', () => {
    ok(C.validateEnvelope({ aggression: { min: 0.5, max: 0.8, base: 0.4 } }).length > 0);
    ok(C.validateEnvelope({ aggression: { min: 0.1, max: 0.8, base: 0.4 } }).length > 0);
    ok(C.validateEnvelope({ bogus: { min: 0, max: 1, base: 0.5 } }).length > 0);
  });

  // ---- the allocation (INTERFACES §3.1)
  test('builds a valid allocation with one crew in slot A', () => {
    const a = build(sel());
    eq(C.validateAllocation(a, ctx), []);
    eq(a.slots.map(s => s.pane), ['A']);
    eq(a.slots.map(s => s.crew[0].trainee_id), ['trainee_a']);
    eq(Object.keys(a), ['allocation_id', 'created_at_session', 'shared', 'slots']);
    eq(a.created_at_session, null);
  });
  test('the allocation id is a valid id and follows the seed and platform', () => {
    const s = sel(); s.opts.seed = 99;
    eq(build(s).allocation_id, 'alloc_99_warship');
  });
  test('expandAllocation gives one valid scenario config', () => {
    const c = cfgs(sel());
    eq(c.length, 1);
    c.forEach((x, i) => eq(C.validateScenarioConfig(x, ctx), [], 'config ' + i));
  });
  test('the derived config carries the run settings and the crew, with the allocation id as scenario_id', () => {
    const [a] = cfgs(sel()), al = build(sel());
    eq(a.scenario_id, 'alloc_1234_warship_A');
    for (const k of ['scenario', 'platform', 'seed', 'mode', 'duration_s', 'eval_interval_s', 'envelope']) eq(a[k], al.shared[k], k);
    eq(a.crew, al.slots[0].crew);
  });
  test('each seat keeps its own agent profile', () => {
    const s = sel(); s.agents.A.navigation = 'trainees/weak_hail_discipline.js';
    const [a] = cfgs(s);
    eq(a.crew.map(m => m.agent_profile), ['trainees/strong.js', 'trainees/strong.js', 'trainees/weak_hail_discipline.js']);
  });
  test('expanding does not share references with the allocation', () => {
    const a = build(sel()), [c] = C.expandAllocation(a), max = F.envelopeDefault.aggression.max;
    c.envelope.aggression.max = 0.5; c.crew[0].trainee_id = 'x'; c.platform.type = 'tank';
    eq(a.shared.envelope.aggression.max, max); eq(a.slots[0].crew[0].trainee_id, 'trainee_a'); eq(a.shared.platform.type, 'warship');
  });
  test('config envelopes are copies of the fixture', () => {
    const before = F.envelopeDefault.aggression.max, a = build(sel()); a.shared.envelope.aggression.max = 0.5;
    eq(F.envelopeDefault.aggression.max, before);
  });
  test('breaking a derived config field makes validation fail', () => {
    const [c] = cfgs(sel());
    const bad = mut => { const x = clone(c); mut(x); return C.validateScenarioConfig(x).length > 0; };
    ok(bad(x => { x.mode = 'easy'; }), 'mode');
    ok(bad(x => { x.seed = 1.5; }), 'seed');
    ok(bad(x => { x.eval_interval_s = x.duration_s; }), 'interval');
    ok(bad(x => { x.extra = 1; }), 'extra field');
    ok(bad(x => { delete x.crew[0].agent_profile; }), 'agent');
    ok(bad(x => { x.envelope.aggression.base = 5; }), 'envelope');
    ok(bad(x => { x.trainee = { trainee_id: 'trainee_a', agent_profile: 'x' }; }), 'old trainee field');
  });
  test('breaking the allocation itself makes validation fail', () => {
    const bad = mut => { const x = build(sel()); mut(x); return C.validateAllocation(x, ctx).length > 0; };
    ok(bad(x => { x.extra = 1; }), 'extra field');
    ok(bad(x => { x.allocation_id = 'Bad Id'; }), 'id');
    ok(bad(x => { x.created_at_session = 5; }), 'created_at_session');
    ok(bad(x => { x.slots.pop(); }), 'no slot');
    ok(bad(x => { x.slots.push(clone(x.slots[0])); }), 'two slots');
    ok(bad(x => { x.slots[0].pane = 'B'; }), 'pane B');
    ok(bad(x => { x.slots[0].extra = 1; }), 'slot extra field');
    ok(bad(x => { delete x.shared.seed; }), 'missing shared seed');
    ok(bad(x => { x.shared.extra = 1; }), 'shared extra field');
    ok(bad(x => { x.shared.seed = -1; }), 'shared seed');
    ok(bad(x => { x.shared = null; }), 'shared null');
    ok(bad(x => { x.slots = null; }), 'slots null');
  });
  test('the same selection builds byte-identical allocations', () => {
    eq(JSON.stringify(build(sel())), JSON.stringify(build(sel())));
  });
  test('selectionFrom restores what buildAllocation built', () => {
    const s = sel(); s.opts.seed = 99; s.opts.mode = 'fixed';
    eq(A.selectionFrom(build(s), ctx), { platform: s.platform, crews: s.crews, agents: s.agents, partners: { A: {} }, opts: s.opts });   // no partner seats: an empty partners map
  });

  // ---- AI partner seats on the allocation page (INTERFACES §3.2)
  const stubParams = from => ({ rates: { hail_acknowledged: 0.26, safe_passage: 0.75 }, reaction_delay_s: 20,
    basis: { source: 'profile', sessions: 0, by_competency: { hail_discipline: 'profile' } } });
  const buildP = s => A.buildAllocation(s, F.envelopeDefault, stubParams);
  test('a partner seat is set, cleared, and replaced by seating a trainee', () => {
    const s = A.setPartner(sel(), 'A', 'weapons', 'trainee_b');
    eq([A.roleOf(s, 'A', 'weapons'), A.derivedOf(s, 'A', 'weapons'), s.crews.A.weapons, s.agents.A.weapons], ['partner', 'trainee_b', null, '']);
    eq(A.roleOf(sel(), 'A', 'weapons'), 'trainee', 'a selection without partners has only trainee seats');
    eq(A.roleOf(A.clearPartner(s, 'A', 'weapons'), 'A', 'weapons'), 'trainee');
    const back = A.seatTrainee(s, 'A', 'weapons', 'trainee_c05', 'trainees/strong.js');
    eq([A.roleOf(back, 'A', 'weapons'), back.crews.A.weapons], ['trainee', 'trainee_c05']);
  });
  test('a partner seat counts as filled only once it knows whose runs it copies, and nextEmptySeat respects that', () => {
    const open = A.setPartner(sel(), 'A', 'weapons', '');
    eq(A.seatFilled(open, 'A', 'weapons'), false);
    eq(A.seatFilled(A.setPartner(sel(), 'A', 'weapons', 'trainee_b'), 'A', 'weapons'), true);
    eq(A.nextEmptySeat(open, { crew: 'A', seat: 'navigation' }), { crew: 'A', seat: 'weapons' });
  });
  test('checkSelection: a partner needs a source, and at least one seat must be a trainee', () => {
    ok('seat_A_weapons' in A.checkSelection(A.setPartner(sel(), 'A', 'weapons', ''), ctx), 'no source');
    eq(A.checkSelection(A.setPartner(sel(), 'A', 'weapons', 'trainee_b'), ctx), {}, 'a partner with a source is ready');
    let all = sel(); for (const seat of ['weapons', 'sensors', 'navigation']) all = A.setPartner(all, 'A', seat, 'trainee_b');
    ok('crew_A' in A.checkSelection(all, ctx), 'all partners');
  });
  test('a partner seat does not count as the same trainee twice, and may copy a trainee who is also in the crew', () => {
    const s = A.setPartner(sel(), 'A', 'weapons', 'trainee_c01');   // trainee_c01 is in the sensors seat
    eq(A.checkSelection(s, ctx), {});
  });
  test('buildAllocation turns a partner seat into a valid partner crew entry, and the allocation validates', () => {
    const a = buildP(A.setPartner(sel(), 'A', 'weapons', 'trainee_b')), m = a.slots[0].crew[0];
    eq(m, { seat: 'weapons', trainee_id: 'partner_weapons', role: 'partner', derived_from: { trainee_id: 'trainee_b' }, agent_params: stubParams() });
    eq(C.validateAllocation(a, { scenarios: ids, domainOf }), []);
    eq(a.slots[0].crew[1].agent_profile, 'trainees/strong.js', 'trainee seats are unchanged');
  });
  test('buildAllocation without a partner needs no parameter function, and with one but none available says so', () => {
    eq(C.validateAllocation(A.buildAllocation(sel(), F.envelopeDefault), { scenarios: ids, domainOf }), []);
    let msg = ''; try { A.buildAllocation(A.setPartner(sel(), 'A', 'weapons', 'trainee_b'), F.envelopeDefault); } catch (e) { msg = e.message; }
    ok(/Assess\.partnerParams/.test(msg), msg);
  });
  test('selectionFrom restores a partner seat from a saved allocation', () => {
    const s = A.setPartner(sel(), 'A', 'sensors', 'trainee_b');
    const back = A.selectionFrom(buildP(s), ctx);
    eq([A.roleOf(back, 'A', 'sensors'), A.derivedOf(back, 'A', 'sensors'), back.crews.A.sensors], ['partner', 'trainee_b', null]);
    eq(back.crews.A.weapons, 'trainee_a');
  });
  test('changing the platform keeps a partner seat whose seat id exists on the new platform', () => {
    const s = A.setPartner(sel(), 'A', 'weapons', 'trainee_b');
    const same = A.withPlatform(s, { type: 'warship', model: 'lcs-independence' }, ids, domainOf);
    eq(A.derivedOf(same, 'A', 'weapons'), 'trainee_b');
    const other = A.withPlatform(s, { type: 'tank', model: 'leopard2sg' }, ids, domainOf);
    eq(Object.keys(other.partners.A), [], 'tank seats do not include weapons');
  });
  test('describePartner says in words where the numbers come from', () => {
    const t = A.describePartner(stubParams(), 'Ben Ong');
    ok(/^Plays like Ben Ong, from the profile averages\./.test(t), t);
    ok(/answers a hail 26% of the time/.test(t) && /keeps a safe passing distance 75% of the time/.test(t), t);
    ok(/from 2 saved sessions/.test(A.describePartner({ rates: {}, basis: { source: 'history', sessions: 2 } }, 'X')));
    ok(/defaults \(no data on them yet\)/.test(A.describePartner({ rates: {}, basis: { source: 'default', sessions: 0 } }, 'X')));
  });
  test('selectionFrom returns null for bad input, including the older formats', () => {
    eq(A.selectionFrom(null, ctx), null); eq(A.selectionFrom('x', ctx), null); eq(A.selectionFrom([], ctx), null);
    eq(A.selectionFrom({}, ctx), null); eq(A.selectionFrom([{}, {}], ctx), null); eq(A.selectionFrom([null, undefined], ctx), null);
    const older = cfgs(sel());                       // the earlier format: an array of per-pane configs
    eq(A.selectionFrom(older, ctx), null);
    const oldest = older.map(c => { const o = clone(c); delete o.platform; delete o.crew;   // one trainee per pane
      o.trainee = { trainee_id: 'trainee_a', agent_profile: 'trainees/strong.js' }; return o; });
    eq(A.selectionFrom(oldest, ctx), null);
  });

  // ---- platform types and seats
  test('seat counts per type: fighter 2, warship 3, tank 2', () => {
    eq(A.seatsOf('fighter'), ['pilot', 'weapon']);
    eq(A.seatsOf('warship'), ['weapons', 'sensors', 'navigation']);
    eq(A.seatsOf('tank'), ['commander', 'driver']);
  });
  test('every model builds a valid allocation with the right number of seats', () => {
    for (const m of F.platformModels) {
      const s = filled(m.type, m.id), a = build(s);
      eq(A.checkSelection(s, ctx), {}, m.id);
      a.slots.forEach(slot => eq(slot.crew.length, A.seatsOf(m.type).length, m.id));
      eq(C.validateAllocation(a, ctx), [], m.id);
    }
  });
  test('a crew with the wrong number of seats is rejected', () => {
    const a = build(filled('tank', 'leopard2sg'));
    a.slots[0].crew.push({ seat: 'gunner', trainee_id: 'trainee_c09', agent_profile: 'x' });
    ok(C.validateAllocation(a, ctx).length > 0, 'tank with 3');
    const b = build(filled('tank', 'leopard2sg')); b.slots[0].crew.pop();
    ok(C.validateAllocation(b, ctx).length > 0, 'tank with 1');
  });
  test('seat ids must match the platform type and order', () => {
    const a = build(sel()); a.slots[0].crew[0].seat = 'pilot';
    ok(C.validateAllocation(a, ctx).length > 0, 'pilot on a warship');
    const b = build(sel()); [b.slots[0].crew[0], b.slots[0].crew[1]] = [b.slots[0].crew[1], b.slots[0].crew[0]];
    ok(C.validateAllocation(b, ctx).length > 0, 'order');
  });
  test('an unknown platform type is rejected', () => {
    const a = build(sel()); a.shared.platform.type = 'submarine';
    ok(C.validateAllocation(a, ctx).length > 0);
  });
  test('the same trainee in two seats of one crew is rejected', () => {
    const a = build(sel()); a.slots[0].crew[1].trainee_id = a.slots[0].crew[0].trainee_id;
    ok(C.validateAllocation(a, ctx).length > 0);
  });

  test('each platform type maps to one domain: fighter air, warship sea, tank land', () => {
    eq(C.DOMAIN_BY_TYPE, { fighter: 'air', warship: 'sea', tank: 'land' });
  });
  test('a scenario of the wrong domain is rejected by the selection check and the validator', () => {
    const s = sel(); s.opts.scenario = 'border-patrol';
    ok('scenario' in A.checkSelection(s, ctx));
    ok(C.validateAllocation(build(s), ctx).some(m => /border-patrol/.test(m)));
  });
  test('a scenario without a domain field counts as sea', () => {
    eq(A.domainOfIn({ a: {}, b: { domain: 'land' } })('a'), 'sea');
    eq(A.domainOfIn({ a: {}, b: { domain: 'land' } })('b'), 'land');
    eq(A.domainOfIn({})('missing'), 'sea');
  });
  test('defaultScenarioFor picks a scenario of the matching domain', () => {
    eq(A.defaultScenarioFor('tank', ids, domainOf), 'border-patrol');
    eq(A.defaultScenarioFor('fighter', ids, domainOf), 'airspace-patrol');
    eq(A.defaultScenarioFor('warship', ids, domainOf), 'strait-transit');
    eq(A.defaultScenarioFor('tank', ['strait-transit'], domainOf), null);
  });

  // ---- switching platform with crews partly filled
  test('another model of the same type keeps the crews', () => {
    const s = A.withPlatform(sel(), { type: 'warship', model: 'lcs-independence' }, ids, domainOf);
    eq(s.crews, sel().crews); eq(s.agents, sel().agents); eq(s.platform.model, 'lcs-independence');
  });
  test('another platform type clears the seats that no longer exist', () => {
    const s = A.withPlatform(sel(), { type: 'tank', model: 'leopard2sg' }, ids, domainOf);
    eq(s.crews, { A: { commander: null, driver: null } });
    eq(s.agents, { A: { commander: '', driver: '' } });
  });
  test('seat ids that exist in both platforms are carried over', () => {
    const base = A.withPlatform(sel(), { type: 'tank', model: 'leopard2sg' }, ids, domainOf);
    base.crews.A.driver = 'trainee_a'; base.agents.A.driver = 'trainees/strong.js';
    const again = A.withPlatform(base, { type: 'tank', model: 'm1a2sepv3' }, ids, domainOf);
    eq(again.crews.A.driver, 'trainee_a'); eq(again.agents.A.driver, 'trainees/strong.js');
  });
  test('changing the platform type moves the scenario to a matching domain', () => {
    const s = A.withPlatform(sel(), { type: 'fighter', model: 'f15e' }, ids, domainOf);
    eq(s.opts.scenario, 'airspace-patrol');
    const t = A.withPlatform(s, { type: 'tank', model: 'leopard2sg' }, ids, domainOf);
    eq(t.opts.scenario, 'border-patrol');
    const w = A.withPlatform(t, { type: 'warship', model: 'formidable' }, ids, domainOf);
    eq(w.opts.scenario, 'strait-transit');
  });
  test('a scenario that already matches the new type is kept', () => {
    const s = sel(); s.opts.scenario = 'sea-air';
    eq(A.withPlatform(s, { type: 'warship', model: 'lcs-independence' }, ids, domainOf).opts.scenario, 'sea-air');
  });
  test('withPlatform does not change the selection it is given', () => {
    const s = sel(), before = JSON.stringify(s);
    A.withPlatform(s, { type: 'fighter', model: 'f15e' }, ids, domainOf);
    eq(JSON.stringify(s), before);
  });

  // ---- seating trainees
  test('seating a trainee fills the seat and takes the default agent', () => {
    const s = A.withPlatform(sel(), { type: 'tank', model: 'leopard2sg' }, ids, domainOf);
    const n = A.seatTrainee(s, 'A', 'commander', 'trainee_b', 'trainees/weak_hail_discipline.js');
    eq(n.crews.A.commander, 'trainee_b'); eq(n.agents.A.commander, 'trainees/weak_hail_discipline.js');
  });
  test('seating a trainee who is already seated moves them', () => {
    const n = A.seatTrainee(sel(), 'A', 'sensors', 'trainee_a', 'x');
    eq(n.crews.A.sensors, 'trainee_a'); eq(n.crews.A.weapons, null); eq(n.agents.A.weapons, '');
    const seated = A.SLOTS.flatMap(c => Object.values(n.crews[c])).filter(Boolean);
    eq(new Set(seated).size, seated.length);
  });
  test('reseating a seat keeps an agent already chosen for it', () => {
    const n = A.seatTrainee(sel(), 'A', 'weapons', 'trainee_c20', 'trainees/weak_hail_discipline.js');
    eq(n.agents.A.weapons, 'trainees/strong.js');
  });
  test('nextEmptySeat walks the seats and stays put when full', () => {
    let s = A.withPlatform(sel(), { type: 'fighter', model: 'f15e' }, ids, domainOf);
    eq(A.nextEmptySeat(s, { crew: 'A', seat: 'pilot' }), { crew: 'A', seat: 'weapon' });   // all empty: the next seat
    s = A.seatTrainee(s, 'A', 'pilot', 'trainee_a', 'x');
    eq(A.nextEmptySeat(s, { crew: 'A', seat: 'pilot' }), { crew: 'A', seat: 'weapon' });
    s = A.seatTrainee(s, 'A', 'weapon', 'trainee_b', 'x');
    eq(A.nextEmptySeat(s, { crew: 'A', seat: 'weapon' }), { crew: 'A', seat: 'weapon' });
  });

  // ---- selection checks
  test('a ready selection has no errors', () => eq(A.checkSelection(sel(), ctx), {}));
  test('every empty seat blocks handoff, named by crew and seat', () => {
    const s = A.withPlatform(sel(), { type: 'tank', model: 'leopard2sg' }, ids, domainOf);
    eq(Object.keys(A.checkSelection(s, ctx)).filter(k => k.startsWith('seat_')).sort(),
      ['seat_A_commander', 'seat_A_driver']);
  });
  test('the same trainee in two seats is flagged', () => {
    const s = sel(); s.crews.A.navigation = 'trainee_a';
    ok('seat_A_navigation' in A.checkSelection(s, ctx));
  });
  test('a missing agent blocks handoff', () => {
    const s = sel(); s.agents.A.sensors = '';
    ok('agent_A_sensors' in A.checkSelection(s, ctx));
  });
  test('an unknown model, or a model of another type, is flagged', () => {
    const s = sel(); s.platform.model = 'nope'; ok('platform' in A.checkSelection(s, ctx));
    const t = sel(); t.platform.model = 'f15e'; ok('platform' in A.checkSelection(t, ctx));
  });
  test('bad seed, duration and interval are flagged on their own fields', () => {
    const s = sel(); s.opts.seed = 1.5; s.opts.duration_s = 0; s.opts.eval_interval_s = NaN;
    const e = A.checkSelection(s, ctx);
    ok('seed' in e && 'duration_s' in e && 'eval_interval_s' in e);
  });
  test('interval must be shorter than duration', () => {
    const s = sel(); s.opts.eval_interval_s = s.opts.duration_s;
    ok('eval_interval_s' in A.checkSelection(s, ctx));
  });
  test('a scenario that is not loaded is flagged', () => {
    const s = sel(); s.opts.scenario = 'nope'; ok('scenario' in A.checkSelection(s, ctx));
  });

  // ---- seeds and link
  test('nextSeed is repeatable, in range and moves', () => {
    eq(A.nextSeed(1234), A.nextSeed(1234));
    ok(A.nextSeed(1234) !== 1234);
    let s = 1; for (let i = 0; i < 1000; i++) { s = A.nextSeed(s); ok(Number.isInteger(s) && s >= 0 && s <= 0x7fffffff, 'range'); }
  });
  test('the hand-off link round-trips the allocation', () => {
    const a = build(sel());
    eq(JSON.parse(decodeURIComponent(A.handoffUrl(a).split('alloc=')[1])), a);
  });

  // ---- names, summaries, predictions, crew comparison, auto-fill, vehicles
  const prof = id => F.profiles.find(p => p.trainee_id === id);
  const sums = Object.fromEntries(F.profiles.map(p => [p.trainee_id, A.summarise(p)]));
  const focusOf = (type) => F.platformTypes[type].seatFocus;
  const sessionsOf = id => prof(id).sessions_completed;

  test('every roster profile has a unique sample name', () => {
    F.profiles.forEach(p => ok(typeof p.name === 'string' && p.name.length > 0, p.trainee_id + ' name'));
    eq(new Set(F.profiles.map(p => p.name)).size, F.profiles.length);
  });
  test('the validator accepts a missing name, rejects an empty or non-string one', () => {
    const base = clone(prof('trainee_a'));
    delete base.name; eq(C.validateProfile(base), []);
    ok(C.validateProfile(Object.assign(clone(base), { name: '' })).length > 0);
    ok(C.validateProfile(Object.assign(clone(base), { name: 5 })).length > 0);
    ok(C.validateProfile(Object.assign(clone(base), { name: 'x'.repeat(41) })).length > 0);
  });
  test('nameOf falls back to the id', () => {
    eq(A.nameOf(prof('trainee_b')), 'Ben Ong'); eq(A.nameOf({ trainee_id: 'trainee_z' }), 'trainee_z');
  });

  test('describe lists weak, strong, thin and unmeasured competencies in plain words', () => {
    const d = A.describe(prof('trainee_b'));
    eq(d.weak.map(r => r.k), ['hail_discipline']);
    ok(d.strong.some(r => r.k === 'collision_avoidance'));
    ok(/^Focus areas: hail discipline \(0\.26, evidence 19\)\./.test(d.text), d.text);
    ok(/Strengths: /.test(d.text) && !/[Ww]eak/.test(d.text), 'respectful wording: ' + d.text);
    ok(/No evidence yet: .*threat evaluation/.test(d.text), d.text);
  });
  test('describe can be limited to a seat\'s competencies', () => {
    const d = A.describe(prof('trainee_b'), focusOf('warship').navigation);
    ok(!/threat evaluation/.test(d.text), d.text);
    ok(/Focus areas: hail discipline/.test(d.text));
  });
  test('describe says so when nothing is measured', () => {
    const empty = { trainee_id: 'e', sessions_completed: 0, competencies: {}, updated_at_session: null };
    ok(/^Nothing measured yet\./.test(A.describe(empty).text));
  });

  test('previewTarget picks the weakest measured competency of the seat', () => {
    const r = A.previewTarget(prof('trainee_b'), focusOf('warship').navigation, 'adaptive');
    eq([r.competency, r.reason], ['hail_discipline', 'weakest_in_seat']);
  });
  test('previewTarget falls back to the weakest overall when the seat has no evidence', () => {
    const r = A.previewTarget(prof('trainee_b'), focusOf('warship').sensors, 'adaptive');
    eq([r.competency, r.reason], ['hail_discipline', 'weakest_overall']);
  });
  test('previewTarget gives nothing in fixed mode or without evidence', () => {
    eq(A.previewTarget(prof('trainee_b'), ['hail_discipline'], 'fixed').reason, 'fixed_mode');
    const empty = { trainee_id: 'e', sessions_completed: 0, competencies: {}, updated_at_session: null };
    eq(A.previewTarget(empty, ['hail_discipline'], 'adaptive'), { competency: null, reason: 'no_evidence' });
  });
  test('the page preview agrees with Devin\'s Adapt.predictTarget for every trainee in every seat, in both modes', () => {
    ok(window.Adapt && typeof Adapt.predictTarget === 'function', 'Adapt.predictTarget is loaded');
    let n = 0;
    for (const [type, info] of Object.entries(F.platformTypes)) for (const seat of info.seats) for (const p of F.profiles) for (const mode of ['adaptive', 'fixed']) {
      const a = A.previewTarget(p, info.seatFocus[seat], mode);
      const b = Adapt.predictTarget({ profile: clone(p), seat, competencies: info.seatFocus[seat], mode });
      eq([a.competency, a.reason], [b.competency, b.reason], `${type}/${seat}/${p.trainee_id}/${mode}`);
      n++;
    }
    ok(n > 200, 'checked ' + n);
  });
  test('describePrediction labels a preview and leaves an Adapt answer unlabelled', () => {
    const r = { competency: 'hail_discipline', mean: 0.26, reason: 'weakest_in_seat' };
    ok(/\(preview\)$/.test(A.describePrediction(Object.assign({ source: 'preview' }, r))));
    ok(!/preview/.test(A.describePrediction(Object.assign({ source: 'adapt', settings: ['weight.ignoredWarning'] }, r))));
    ok(/Nudges: weight\.ignoredWarning/.test(A.describePrediction({ source: 'adapt', settings: ['weight.ignoredWarning'], competency: 'hail_discipline', reason: 'weakest_in_seat' })));
  });

  test('suggestCrew gives the navigation seat the trainee weakest at hail discipline', () => {
    const r = A.suggestCrew(F.profiles, sums, 'warship', focusOf('warship'), 'hail_discipline');
    const nav = r.picks.find(x => x.seat === 'navigation'), earlier = r.picks.filter(x => x !== nav).map(x => x.id);
    const rivals = F.profiles.map(p => p.trainee_id).filter(id => !earlier.includes(id) && sums[id].hail_discipline.enough);
    eq(nav.k, 'hail_discipline');
    ok(rivals.every(id => sums[id].hail_discipline.mean >= nav.mean - 1e-12), 'nobody weaker was left out');
  });
  test('suggestCrew fills every seat once, with no trainee twice, for every platform type', () => {
    for (const t of Object.keys(F.platformTypes)) {
      const r = A.suggestCrew(F.profiles, sums, t, focusOf(t), 'hail_discipline');
      ok(r, t + ' result');
      const got = Object.values(r.crews.A);
      eq(got.length, A.seatsOf(t).length, t + ' seats'); eq(new Set(got).size, got.length, t + ' unique');
    }
  });
  test('suggestCrew is deterministic and works without a preferred competency', () => {
    eq(A.suggestCrew(F.profiles, sums, 'tank', focusOf('tank')), A.suggestCrew(F.profiles, sums, 'tank', focusOf('tank')));
    ok(A.suggestCrew(F.profiles, sums, 'fighter', focusOf('fighter'), 'hail_discipline'), 'fighter has no hail seat but still gets a crew');
  });
  test('suggestCrew returns null when nobody has evidence', () => {
    eq(A.suggestCrew([], {}, 'warship', focusOf('warship'), null), null);
  });
  test('a suggested allocation is valid once agents are chosen', () => {
    const r = A.suggestCrew(F.profiles, sums, 'warship', focusOf('warship'), 'hail_discipline');
    const s = sel(); s.crews = r.crews;
    for (const c of A.SLOTS) for (const seat of Object.keys(s.crews[c])) s.agents[c][seat] = 'trainees/strong.js';
    eq(A.checkSelection(s, ctx), {}); eq(C.validateAllocation(build(s), { scenarios: ids, domainOf }), []);
  });

  test('every platform type has a vehicle diagram with one marker per seat, in seat order', () => {
    for (const t of Object.keys(F.platformTypes)) {
      eq(CGF.vehicles.seatsOf(t), C.SEATS_BY_TYPE[t], t);
      const svg = CGF.vehicles.svg(t, { [C.SEATS_BY_TYPE[t][0]]: { name: 'Aisha Rahman', active: true } }, 'A');
      eq((svg.match(/class="seatDot"/g) || []).length, C.SEATS_BY_TYPE[t].length, t + ' markers');
      ok(svg.includes('>AR<'), t + ' initials');
    }
  });
  test('vehicle diagrams escape names', () => {
    const svg = CGF.vehicles.svg('tank', { commander: { name: '<img onerror=x>', active: false } }, 'A');
    ok(!svg.includes('<img'), 'escaped');
  });

  // ---- runtime contracts: §4 event, §7 adjustment, §9.1 session record
  const mkEv = o => Object.assign({ event_id: 'e_000187', t: 642, session_id: 's_x', trainee_id: 'trainee_b', seat: 'navigation', type: 'hail_ignored',
    competency: 'hail_discipline', outcome: 'fail', unit_id: 'R-21', detail: { warning_level: 2 } }, o);
  const mkAdj = o => Object.assign({ adjustment_id: 'a_0009', t: 660, session_id: 's_x', force: 'hostile-state', setting: 'weight.ignoredWarning',
    old: 1, new: 1.25, requested: 1.25, clamped: false, target_competency: 'hail_discipline', seat: 'navigation', pressure_direction: 'up',
    source: 'engine', policy: 'rules_v1', evidence_event_ids: ['e_000143'], explanation: null }, o);
  const mkRec = o => Object.assign({ session_id: 's_x', pane: 'B', scenario: 'strait-transit', seed: 42, mode: 'adaptive', platform: 'warship',
    crew: [{ seat: 'weapons', trainee_id: 'trainee_c07' }, { seat: 'sensors', trainee_id: 'trainee_c03' }, { seat: 'navigation', trainee_id: 'trainee_b' }],
    outcome: 'success', duration_s: 2400, events: [mkEv()], adjustments: [mkAdj()] }, o);
  const bad = (errs, re) => ok(errs.length > 0 && (!re || errs.some(m => re.test(m))), 'expected an error' + (re ? ' ' + re : '') + ', got ' + JSON.stringify(errs));

  test('the event table matches INTERFACES §4: every type names a catalog competency or none', () => {
    for (const [t, [k, o]] of Object.entries(C.EVENT_TYPES)) {
      ok(k === null ? o === null : C.COMPETENCIES.includes(k) && ['success', 'fail'].includes(o), t);
    }
  });
  test('validateEvent accepts a competency event and a crew-wide event', () => {
    eq(C.validateEvent(mkEv()), []);
    eq(C.validateEvent(mkEv({ type: 'tension_peak', competency: null, outcome: null, seat: null, trainee_id: null, unit_id: 'R-21' })), []);
  });
  test('validateEvent rejects a wrong competency or outcome for the type, a missing seat, an unknown type and extra fields', () => {
    bad(C.validateEvent(mkEv({ competency: 'collision_avoidance' })), /competency/);
    bad(C.validateEvent(mkEv({ outcome: 'success' })), /outcome/);
    bad(C.validateEvent(mkEv({ seat: null })), /seat/);
    bad(C.validateEvent(mkEv({ type: 'tension_peak', competency: null, outcome: null, seat: 'navigation' })), /null for a crew-wide/);
    bad(C.validateEvent(mkEv({ type: 'nope' })), /event.type/);
    bad(C.validateEvent(Object.assign(mkEv(), { extra: 1 })), /unknown field/);
    const m = mkEv(); delete m.detail; bad(C.validateEvent(m), /required/);
    bad(C.validateEvent(mkEv(), ['weapons', 'sensors']), /not a seat of this crew/);
  });
  test('validateAdjustment accepts the §7 example and checks the clamp flag', () => {
    eq(C.validateAdjustment(mkAdj()), []);
    eq(C.validateAdjustment(mkAdj({ requested: 2.0, new: 1.5, clamped: true })), []);
    bad(C.validateAdjustment(mkAdj({ requested: 2.0, new: 1.5, clamped: false })), /clamped/);
    bad(C.validateAdjustment(mkAdj({ clamped: true })), /clamped/);
  });
  test('validateAdjustment rejects unknown settings, directions, sources and extra or missing fields', () => {
    bad(C.validateAdjustment(mkAdj({ setting: 'weight.cpa!' })), /setting/);
    bad(C.validateAdjustment(mkAdj({ setting: 'nope' })), /setting/);
    bad(C.validateAdjustment(mkAdj({ pressure_direction: 'sideways' })), /pressure_direction/);
    bad(C.validateAdjustment(mkAdj({ source: 'ai' })), /source/);
    bad(C.validateAdjustment(mkAdj({ target_competency: 'piracy_response' })), /target_competency/);
    bad(C.validateAdjustment(Object.assign(mkAdj(), { extra: 1 })), /unknown field/);
    const m = mkAdj(); delete m.seat; bad(C.validateAdjustment(m), /required/);
  });
  test('validateAdjustment holds a value to the envelope when one is given (invariant 1)', () => {
    const env = { 'weight.ignoredWarning': { min: 0.5, max: 2.0, base: 1.0 } };
    eq(C.validateAdjustment(mkAdj({ new: 2.0, requested: 2.0 }), { envelope: env }), []);
    bad(C.validateAdjustment(mkAdj({ new: 2.4, requested: 2.4 }), { envelope: env }), /outside the envelope/);
  });
  test('validateSessionRecord accepts a full record, with a null pane for a local run', () => {
    eq(C.validateSessionRecord(mkRec()), []);
    eq(C.validateSessionRecord(mkRec({ pane: null })), []);
    eq(C.validateSessionRecord(mkRec({ events: [], adjustments: [] })), []);
  });
  test('validateSessionRecord checks the crew, the platform and the cross-references', () => {
    bad(C.validateSessionRecord(mkRec({ platform: 'submarine' })), /platform/);
    bad(C.validateSessionRecord(mkRec({ platform: { type: 'warship', model: 'formidable' } })), /platform/);   // the record holds the type string
    bad(C.validateSessionRecord(mkRec({ crew: [{ seat: 'tao', trainee_id: 'trainee_b' }] })), /crew/);
    bad(C.validateSessionRecord(mkRec({ events: [mkEv({ session_id: 's_other' })] })), /must equal the record/);
    bad(C.validateSessionRecord(mkRec({ events: [mkEv({ trainee_id: 'trainee_a' })] })), /not in seat/);
    bad(C.validateSessionRecord(mkRec({ adjustments: [mkAdj({ session_id: 's_other' })] })), /must equal the record/);
    bad(C.validateSessionRecord(mkRec({ adjustments: [mkAdj({ seat: 'tao' })] })), /not a seat/);
    bad(C.validateSessionRecord(mkRec({ mode: 'auto' })), /mode/);
    bad(C.validateSessionRecord(mkRec({ outcome: 'draw' })), /outcome/);
    bad(C.validateSessionRecord(Object.assign(mkRec(), { extra: 1 })), /unknown field/);
  });
  test('validateSessionRecord names the failing event or adjustment by index', () => {
    bad(C.validateSessionRecord(mkRec({ events: [mkEv(), mkEv({ type: 'nope' })] })), /^record\.events\[1\]/);
    bad(C.validateSessionRecord(mkRec({ adjustments: [mkAdj(), mkAdj({ setting: 'nope' })] })), /^record\.adjustments\[1\]/);
  });

  // ---- AI partners (INTERFACES §3.2) and the adjustment cause (§7)
  const pParams = () => ({ rates: { hail_acknowledged: 0.26, safe_passage: 0.75 }, reaction_delay_s: 20,
    basis: { source: 'profile', sessions: 0, by_competency: { hail_discipline: 'profile' } } });
  const partnerEntry = (seat, from) => ({ seat, trainee_id: 'partner_' + seat, role: 'partner', derived_from: { trainee_id: from || 'trainee_b' }, agent_params: pParams() });
  const cfgWith = (seat, entry) => { const c = cfgs(sel())[0]; c.crew = c.crew.map(m => m.seat === seat ? entry : m); return c; };
  const bad2 = (errs, re) => ok(errs.length > 0 && (!re || errs.some(m => re.test(m))), 'expected ' + (re || 'an error') + ', got ' + JSON.stringify(errs));

  test('a crew with an AI partner in one seat validates, and so does the whole allocation', () => {
    eq(C.validateScenarioConfig(cfgWith('weapons', partnerEntry('weapons'))), []);
    const a = build(sel()); a.slots[0].crew[0] = partnerEntry('weapons');
    eq(C.validateAllocation(a, { scenarios: ids, domainOf }), []);
  });
  test('a partner needs its own partner_ id, a derived_from trainee and valid agent_params, and takes no agent_profile', () => {
    const v = mut => { const e = partnerEntry('weapons'); mut(e); return C.validateScenarioConfig(cfgWith('weapons', e)); };
    bad2(v(e => { e.trainee_id = 'trainee_c05'; }), /partner id/);
    bad2(v(e => { delete e.derived_from; }), /derived_from/);
    bad2(v(e => { delete e.agent_params; }), /agent_params/);
    bad2(v(e => { e.agent_profile = 'trainees/strong.js'; }), /unknown field "agent_profile"/);
    bad2(v(e => { e.derived_from = { trainee_id: 'partner_sensors' }; }), /not of another partner/);
    bad2(v(e => { e.derived_from = { trainee_id: 'trainee_b', session_ids: [1] }; }), /session_ids/);
  });
  test('a trainee id may not look like a partner id, and a crew cannot be all partners', () => {
    const e = { seat: 'weapons', trainee_id: 'partner_x', agent_profile: 'trainees/strong.js' };
    bad2(C.validateScenarioConfig(cfgWith('weapons', e)), /partner/);
    const all = cfgs(sel())[0]; all.crew = all.crew.map(m => partnerEntry(m.seat));
    bad2(C.validateScenarioConfig(all), /at least one seat must be a trainee/);
  });
  test('agent_params checks the rates, the delay and the basis', () => {
    const v = mut => { const p = pParams(); mut(p); return C.validateAgentParams(p, 'p'); };
    eq(v(() => {}), []);
    bad2(v(p => { p.rates.hail_ignored = 0.5; }), /not a success event type/);
    bad2(v(p => { p.rates.hail_acknowledged = 1.2; }), /0 to 1/);
    bad2(v(p => { p.rates = {}; }), /at least one/);
    bad2(v(p => { p.reaction_delay_s = 400; }), /reaction_delay_s/);
    bad2(v(p => { p.basis.source = 'guess'; }), /basis.source/);
    bad2(v(p => { p.basis.sessions = -1; }), /sessions/);
    bad2(v(p => { p.basis.by_competency = { hail_discipline: 'guess' }; }), /by_competency/);
    bad2(v(p => { p.extra = 1; }), /unknown field/);
  });
  test('a session record can list a partner, its events validate, and no adjustment may name a partner seat', () => {
    const crew = [{ seat: 'weapons', trainee_id: 'partner_weapons', role: 'partner', derived_from: { trainee_id: 'trainee_b' } },
      { seat: 'sensors', trainee_id: 'trainee_c03' }, { seat: 'navigation', trainee_id: 'trainee_b' }];
    const partnerEv = mkEv({ trainee_id: 'partner_weapons', seat: 'weapons', type: 'fc_restraint', competency: 'weapons_discipline', outcome: 'success' });
    eq(C.validateSessionRecord(mkRec({ crew, events: [partnerEv], adjustments: [mkAdj()] })), []);
    bad2(C.validateSessionRecord(mkRec({ crew, events: [], adjustments: [mkAdj({ seat: 'weapons' })] })), /AI partner seat/);
    bad2(C.validateSessionRecord(mkRec({ crew: crew.map((m, i) => i ? m : { seat: m.seat, trainee_id: m.trainee_id, role: 'partner' }) })), /derived_from/);
    bad2(C.validateSessionRecord(mkRec({ crew: crew.map((m, i) => i === 1 ? Object.assign({}, m, { derived_from: { trainee_id: 'trainee_b' } }) : m) })), /only a partner has one/);
  });
  test('adjustment.cause is optional, and when present is live, history or team', () => {
    eq(C.validateAdjustment(mkAdj()), []);
    for (const cause of ['live', 'history', 'team']) eq(C.validateAdjustment(mkAdj({ cause })), [], cause);
    bad2(C.validateAdjustment(mkAdj({ cause: 'vibes' })), /adjustment.cause/);
    eq(C.CAUSES, ['live', 'history', 'team']);
  });

  // ---- decisions of 2026-10-29: run length and the default envelope
  test('the default run is 2400 s with an evaluation every 30 s', () => {
    eq([A.DEFAULTS.duration_s, A.DEFAULTS.eval_interval_s], [2400, 30]);
  });
  test('the default envelope is valid, starts near the runtime defaults, and has room both ways', () => {
    eq(C.validateEnvelope(F.envelopeDefault), []);
    for (const k of ['aggression', 'sensitivity']) eq(F.envelopeDefault[k].base, 1.0, k);
    for (const [k, e] of Object.entries(F.envelopeDefault)) ok(e.min < e.base && e.base < e.max, k + ' has room above and below the base');
  });
  test('every setting a competency tactic nudges has an envelope entry, except the two noted omissions', () => {
    ok(window.Adapt && Adapt.TACTICS, 'Adapt.TACTICS is loaded');
    const OMITTED = ['calm_down_rate', 'detection'];   // runtime defaults not confirmed, see fixtures/envelope-default.js
    for (const [k, list] of Object.entries(Adapt.TACTICS)) list.forEach(s => ok(s in F.envelopeDefault || OMITTED.includes(s), `${k}: ${s}`));
  });

  const failed = results.filter(r => r[1]);
  document.getElementById('summary').textContent = `${results.length - failed.length} / ${results.length} passed`;
  document.getElementById('summary').className = failed.length ? 'fail' : 'pass';
  document.getElementById('results').innerHTML = results.map(([n, e]) =>
    `<li class="${e ? 'fail' : 'pass'}">${e ? 'FAIL' : 'PASS'} · ${n}${e ? ' — ' + e : ''}</li>`).join('');
})();
</script>
</body>
</html>
