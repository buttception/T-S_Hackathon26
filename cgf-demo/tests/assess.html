<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Assess tests</title>
<style>
  body { font: 14px/1.5 "Segoe UI", system-ui, sans-serif; background: #0b1420; color: #d6e2f0; padding: 16px; }
  .pass { color: #4dd17a; } .fail { color: #ff7b54; } h1 { font-size: 16px; }
  #summary { font-weight: 700; margin: 8px 0 12px; }
</style>
</head>
<body>
<h1>Assess tests (competency update, profile persistence, cohort, AI partner parameters)</h1>
<div id="summary">running…</div>
<ul id="results"></ul>

<script src="../js/util.js"></script>
<script src="../contracts/contracts.js"></script>
<script src="../fixtures/profiles/roster.js"></script>
<script src="../js/assess/assess.js"></script>
<script src="../js/ui-cohort.js"></script>
<script src="../js/assess/runs.js"></script>
<script src="../js/ui-compare.js"></script>
<script>
(function () {
  const C = CGF.contracts, A = CGF.Assess, F = window.CGF_FIXTURES;
  const results = [];
  const test = (name, fn) => { try { reset(); fn(); results.push([name, null]); } catch (e) { results.push([name, e.message]); } };
  const eq = (a, b, msg) => { if (JSON.stringify(a) !== JSON.stringify(b)) throw new Error((msg || 'not equal') + ': got ' + JSON.stringify(a) + ', want ' + JSON.stringify(b)); };
  const ok = (c, msg) => { if (!c) throw new Error(msg || 'expected true'); };
  const clone = o => JSON.parse(JSON.stringify(o));

  function reset() {
    Object.keys(localStorage).filter(k => k.startsWith('cgf.profile.') || k === 'cgf.assessed' || k === 'cgf.runs').forEach(k => localStorage.removeItem(k));
    CGF.History = undefined;
  }

  const ev = (n, trainee, seat, type, competency, outcome) => ({ event_id: 'e_' + n, t: n * 10, session_id: 's_t1', trainee_id: trainee, seat,
    type, competency, outcome, unit_id: 'ship_2', detail: {} });
  const hailFail = (n, id) => ev(n, id, 'navigation', 'hail_ignored', 'hail_discipline', 'fail');
  const hailOk = (n, id) => ev(n, id, 'navigation', 'hail_acknowledged', 'hail_discipline', 'success');
  const record = (events, sid) => ({ session_id: sid || 's_t1', pane: null, scenario: 'strait-transit', seed: 1, mode: 'adaptive', platform: 'warship',
    crew: [{ seat: 'weapons', trainee_id: 'trainee_a' }, { seat: 'sensors', trainee_id: 'trainee_c01' }, { seat: 'navigation', trainee_id: 'trainee_b' }],
    outcome: 'success', duration_s: 900, events, adjustments: [] });
  const hail = p => p.competencies.hail_discipline;

  test('the seeded roster has the demo trainees and a cohort', () => {
    ok(A.profiles().length >= 22, 'profiles: ' + A.profiles().length);
    ok(A.profile('trainee_b').trainee_id === 'trainee_b');
  });

  test('an unknown trainee gets an empty profile that passes the contract', () => {
    const p = A.profile('trainee_new');
    eq(C.validateProfile(p), []);
    eq(p.sessions_completed, 0);
  });

  test('failed hail events lower hail_discipline for the trainee who caused them, and only for them', () => {
    const before = A.means(A.profile('trainee_b')).hail_discipline, otherBefore = clone(A.profile('trainee_a'));
    const out = A.update(record([1, 2, 3, 4, 5].map(n => hailFail(n, 'trainee_b'))));
    ok(A.means(out.trainee_b).hail_discipline < before, 'mean fell');
    eq(hail(out.trainee_b).beta, hail(A.profile('trainee_b')).beta);
    eq(out.trainee_a.competencies, otherBefore.competencies, 'trainee_a unchanged');
  });

  test('successes raise alpha, failures raise beta, by one per event', () => {
    const b0 = clone(hail(A.profile('trainee_b')));
    A.update(record([hailOk(1, 'trainee_b'), hailOk(2, 'trainee_b'), hailFail(3, 'trainee_b')]));
    const b1 = hail(A.profile('trainee_b'));
    eq([b1.alpha - b0.alpha, b1.beta - b0.beta], [2, 1]);
  });

  test('sessions_completed and updated_at_session move, and the profile passes the contract', () => {
    const n0 = A.profile('trainee_b').sessions_completed;
    const out = A.update(record([hailFail(1, 'trainee_b')], 's_t9'));
    eq(out.trainee_b.sessions_completed, n0 + 1);
    eq(out.trainee_b.updated_at_session, 's_t9');
    eq(C.validateProfile(out.trainee_b), []);
  });

  test('the profile round-trips through storage', () => {
    A.update(record([hailFail(1, 'trainee_b')]));
    const raw = JSON.parse(localStorage.getItem('cgf.profile.trainee_b'));
    eq(raw, A.profile('trainee_b'));
    ok(A.profiles().some(p => p.trainee_id === 'trainee_b' && p.updated_at_session === 's_t1'));
  });

  test('applying the same session twice changes nothing the second time', () => {
    const r = record([1, 2].map(n => hailFail(n, 'trainee_b')));
    A.update(r);
    const once = clone(A.profile('trainee_b'));
    A.update(r);
    eq(A.profile('trainee_b'), once);
  });

  test('events with no competency, an unknown competency or another outcome are ignored', () => {
    const before = clone(A.profile('trainee_b'));
    A.update(record([ev(1, 'trainee_b', null, 'tension_peak', null, null), ev(2, 'trainee_b', 'navigation', 'x', 'made_up', 'fail'),
      ev(3, 'trainee_b', 'navigation', 'hail_ignored', 'hail_discipline', 'none')]));
    eq(A.profile('trainee_b').competencies, before.competencies);
  });

  test('a competency the profile did not hold starts from the prior', () => {
    const e = ev(1, 'trainee_new', 'navigation', 'hail_ignored', 'hail_discipline', 'fail');
    const r = record([e]); r.crew[2].trainee_id = 'trainee_new';
    const out = A.update(r);
    eq(hail(out.trainee_new), { alpha: 1, beta: 2 });
  });

  test('the history store gets the new means for every crew member, and a missing entry does not stop the update', () => {
    const calls = [];
    CGF.History = { attachAssessment: (id, sid, m) => calls.push([id, sid, m]) };
    A.update(record([hailFail(1, 'trainee_b')]));
    eq(calls.map(c => c[0]).sort(), ['trainee_a', 'trainee_b', 'trainee_c01']);
    eq(calls[0][1], 's_t1');
    eq(calls.find(c => c[0] === 'trainee_b')[2], A.means(A.profile('trainee_b')));
    CGF.History = { attachAssessment: () => { throw new Error('no stored history entry'); } };
    A.update(record([hailFail(1, 'trainee_b')], 's_t2'));
    eq(A.profile('trainee_b').updated_at_session, 's_t2');
  });

  test('a record without crew and events is refused', () => {
    let msg = ''; try { A.update({ session_id: 's' }); } catch (e) { msg = e.message; }
    ok(/session record/.test(msg), msg);
  });

  test('cohort returns a trainee by competency matrix for the seeded roster, and follows an update', () => {
    const m0 = A.cohort();
    eq(Object.keys(m0).length, A.profiles().length);
    ok(typeof m0.trainee_b.hail_discipline === 'number');
    A.update(record([1, 2, 3, 4, 5, 6].map(n => hailFail(n, 'trainee_b'))));
    ok(A.cohort().trainee_b.hail_discipline < m0.trainee_b.hail_discipline, 'cohort follows the update');
  });

  test('Assess.update skips an AI partner: no profile, no history, and the real trainee is still updated', () => {
    const crew = [{ seat: 'weapons', trainee_id: 'partner_weapons', role: 'partner', derived_from: { trainee_id: 'trainee_b' } },
      { seat: 'sensors', trainee_id: 'trainee_c01' }, { seat: 'navigation', trainee_id: 'trainee_b' }];
    const rec = Object.assign(record([1, 2, 3].map(n => hailFail(n, 'trainee_b')).concat([ev(9, 'partner_weapons', 'weapons', 'fc_radar_lock', 'weapons_discipline', 'fail')])), { crew });
    const before = clone(A.profile('trainee_b'));
    const out = A.update(rec);
    ok(!('partner_weapons' in out), 'the partner is not in the result');
    eq(Object.keys(localStorage).filter(k => k.startsWith('cgf.profile.partner')), [], 'no stored partner profile');
    eq(A.profile('partner_weapons').sessions_completed, 0);
    ok(out.trainee_b.sessions_completed === before.sessions_completed + 1, 'the trainee is updated');
  });

  // ---- cohort summary (J6)
  test('cohortSummary counts only profiles with enough evidence, and says null where nobody is rated', () => {
    const s = A.cohortSummary(), m = A.cohort();
    eq(s.trainees, A.profiles().length);
    ok(s.competencies.hail_discipline.rated >= 15, 'hail rated: ' + s.competencies.hail_discipline.rated);
    ok(s.competencies.hail_discipline.mean > 0 && s.competencies.hail_discipline.mean < 1);
    for (const k of ['threat_evaluation', 'contact_detection', 'picture_reporting', 'escalation_control'])
      eq([s.competencies[k].rated, s.competencies[k].mean, s.competencies[k].share_below_half], [0, null, null], k);
    const below = A.profiles().filter(p => { const ab = p.competencies.hail_discipline; return ab && ab.alpha + ab.beta >= 8 && ab.alpha / (ab.alpha + ab.beta) < 0.5; }).length;
    eq(s.competencies.hail_discipline.below_half, below);
    ok(Object.keys(m).length === s.trainees);
  });
  test('cohortSummary follows a competency update', () => {
    const before = A.cohortSummary().competencies.hail_discipline.mean;
    A.update(record([1, 2, 3, 4, 5, 6, 7, 8].map(n => hailFail(n, 'trainee_a'))));
    ok(A.cohortSummary().competencies.hail_discipline.mean < before, 'cohort mean fell');
  });

  // ---- cohort view (js/ui-cohort.js): logic only
  const V = CGF.cohortView;
  test('heatLevel maps a mean onto five steps and null onto no evidence', () => {
    eq([0, 0.19, 0.2, 0.39, 0.4, 0.59, 0.6, 0.79, 0.8, 1].map(V.heatLevel), [0, 0, 1, 1, 2, 2, 3, 3, 4, 4]);
    eq([V.heatLevel(null), V.heatLevel(undefined), V.heatLevel(NaN)], [null, null, null]);
  });
  test('the cohort matrix is in id order, never sorted by performance, and counts only enough evidence', () => {
    const rows = V.matrix(A.profiles(), C.COMPETENCIES, A.EVIDENCE_MIN), ids = rows.map(r => r.trainee_id);
    eq(ids, ids.slice().sort());
    const b = rows.find(r => r.trainee_id === 'trainee_b');
    eq(b.cells.hail_discipline, { mean: 0.26, enough: true });
    eq(b.cells.threat_evaluation, { mean: null, enough: false });
    eq(b.name, 'Ben Ong');
    const thin = V.matrix([{ trainee_id: 'x', sessions_completed: 1, competencies: { hail_discipline: { alpha: 4, beta: 3 } } }], C.COMPETENCIES, A.EVIDENCE_MIN);
    eq(thin[0].cells.hail_discipline.enough, false, '7 events is below the minimum of 8');
  });
  test('every competency has a plain label, and the summary note is honest about thin or missing data', () => {
    C.COMPETENCIES.forEach(k => ok(V.LONG[k] && V.label(k) === V.LONG[k], k));
    ok(/Not measured yet/.test(V.summaryNote({ rated: 0, mean: null, below_half: 0, share_below_half: null })));
    ok(/Only 3 trainees rated/.test(V.summaryNote({ rated: 3, mean: 0.5, below_half: 1, share_below_half: 0.33 })));
    ok(/candidate for more practice/.test(V.summaryNote({ rated: 10, mean: 0.4, below_half: 5, share_below_half: 0.5 })));
    ok(/2 of 10/.test(V.summaryNote({ rated: 10, mean: 0.7, below_half: 2, share_below_half: 0.2 })));
  });

  // ---- saved runs and the baseline comparison (js/assess/runs.js)
  const R = CGF.Runs;
  const adj = (n, setting, oldV, newV, target) => ({ adjustment_id: 'a_' + n, t: n * 30, session_id: 's_x', force: 'all', setting, old: oldV, new: newV, requested: newV,
    clamped: false, target_competency: target || 'hail_discipline', seat: 'navigation', pressure_direction: 'up', source: 'engine', policy: 'rules_v1',
    evidence_event_ids: [], explanation: null });
  const mkRun = (sid, mode, events, adjustments, over) => Object.assign({}, record(events, sid), { mode, adjustments: adjustments || [] }, over || {});
  const hails = (n, ok) => Array.from({ length: n }, (x, i) => (i < ok ? hailOk(i + 1, 'trainee_b') : hailFail(i + 1, 'trainee_b')));

  test('Runs saves records newest last, replaces the same session, and keeps only the latest ten', () => {
    R.save(mkRun('s_1', 'fixed', [])); R.save(mkRun('s_2', 'adaptive', [])); R.save(mkRun('s_1', 'fixed', [hailOk(1, 'trainee_b')]));
    eq(R.list().map(r => r.session_id), ['s_2', 's_1']);
    eq(R.find('s_1').events.length, 1, 'replaced');
    for (let i = 3; i < 15; i++) R.save(mkRun('s_' + i, 'fixed', []));
    eq(R.list().length, R.MAX_RUNS);
    eq(R.list()[R.MAX_RUNS - 1].session_id, 's_14');
    eq(R.find('s_1'), null, 'the oldest was dropped');
  });
  test('Runs.save rejects something that is not a session record', () => {
    for (const bad of [null, {}, { session_id: 's' }, { session_id: 's', events: [], adjustments: [] }]) {
      let msg = ''; try { R.save(bad); } catch (e) { msg = e.message; }
      ok(/session record/.test(msg), JSON.stringify(bad));
    }
  });
  test('baselineFor picks the latest FIXED run on the same scenario, seed, platform and crew', () => {
    R.save(mkRun('s_f1', 'fixed', [])); R.save(mkRun('s_f2', 'fixed', []));
    R.save(mkRun('s_other_seed', 'fixed', [], [], { seed: 99 }));
    R.save(mkRun('s_other_crew', 'fixed', [], [], { crew: [{ seat: 'weapons', trainee_id: 'trainee_c05' }, { seat: 'sensors', trainee_id: 'trainee_c01' }, { seat: 'navigation', trainee_id: 'trainee_b' }] }));
    R.save(mkRun('s_adaptive', 'adaptive', []));
    const target = mkRun('s_target', 'adaptive', []);
    eq(R.baselineFor(target).session_id, 's_f2');
    eq(R.baselineFor(mkRun('s_nope', 'adaptive', [], [], { seed: 5 })), null, 'no run with that seed');
    eq(R.baselineFor(mkRun('s_fixed', 'fixed', [])), null, 'a fixed run has no baseline');
    eq(R.baselineFor(R.find('s_f2')), null);
  });
  test('compare computes success rates per competency and the change in points', () => {
    const base = mkRun('s_b', 'fixed', hails(10, 2)), run = mkRun('s_r', 'adaptive', hails(10, 6), [adj(1, 'sensitivity', 1, 1.2), adj(2, 'sensitivity', 1.2, 1.4), adj(3, 'weight.ignoredWarning', 1, 1.25)]);
    const c = R.compare(base, run), h = c.by_competency.find(x => x.competency === 'hail_discipline');
    eq([h.baseline.success, h.baseline.fail, h.baseline.rate], [2, 8, 0.2]);
    eq([h.run.success, h.run.fail, h.run.rate], [6, 4, 0.6]);
    eq([h.delta, h.enough, h.adjustments_aimed], [0.4, true, 3]);
    eq([c.baseline.mode, c.run.mode, c.baseline.adjustments, c.run.adjustments], ['fixed', 'adaptive', 0, 3]);
  });
  test('compare lists the settings the AI moved, with first and last values', () => {
    const run = mkRun('s_r', 'adaptive', hails(4, 2), [adj(1, 'sensitivity', 1, 1.2), adj(2, 'sensitivity', 1.2, 1.4), adj(3, 'weight.ignoredWarning', 1, 1.25)]);
    const c = R.compare(mkRun('s_b', 'fixed', hails(4, 1)), run);
    eq(c.adjustments.settings[0], { setting: 'sensitivity', changes: 2, first_old: 1, last_new: 1.4 });
    eq(c.adjustments.targeted, { hail_discipline: 3 });
  });
  test('compare refuses to compare a competency with too few events in either run, and says so', () => {
    const c = R.compare(mkRun('s_b', 'fixed', hails(2, 0)), mkRun('s_r', 'adaptive', hails(10, 5)));
    const h = c.by_competency[0];
    eq([h.enough, h.delta], [false, null]);
    ok(c.notes.some(n => /Hail discipline: too few events to compare \(baseline 2, this run 10/.test(n)), c.notes.join(' | '));
  });
  test('every number in a compare note comes from the facts, and the notes include the honesty caveat', () => {
    const c = R.compare(mkRun('s_b', 'fixed', hails(10, 2)), mkRun('s_r', 'adaptive', hails(10, 6), [adj(1, 'sensitivity', 1, 1.2)]));
    ok(c.notes.some(n => /20% success in the fixed baseline, 60% in this run \(\+40 points\), with 1 adjustment aimed at it/.test(n)), c.notes.join(' | '));
    ok(c.notes.some(n => /not proof/.test(n)));
    ok(c.notes.some(n => /1 adjustment in this run; the fixed baseline made 0/.test(n)));
  });
  test('compare is deterministic and needs two records', () => {
    const a = mkRun('s_b', 'fixed', hails(6, 1)), b = mkRun('s_r', 'adaptive', hails(6, 4), [adj(1, 'sensitivity', 1, 1.2)]);
    eq(R.compare(a, b), R.compare(a, b));
    for (const args of [[null, b], [a, null], [{}, b]]) { let msg = ''; try { R.compare(...args); } catch (e) { msg = e.message; } ok(/two session records/.test(msg)); }
  });

  // ---- which two runs the comparison page shows (js/ui-compare.js)
  test('compare page: nothing saved, a fixed run only, an adaptive run without a baseline, and the happy path', () => {
    const ch = CGF.compareView.choose;
    eq(ch([], {}).problem, 'none');
    const f = mkRun('s_f', 'fixed', []), a = mkRun('s_a', 'adaptive', []);
    eq(ch([f], {}).problem, 'not-adaptive');                       // only a fixed run: the latest run is the baseline itself
    eq(ch([a], {}).problem, 'no-baseline');
    const good = ch([f, a], {});
    eq([good.run.session_id, good.baseline.session_id, good.problem], ['s_a', 's_f', null]);
  });
  test('compare page: defaults to the latest adaptive run, honours ?run and ?baseline, and reports what is missing', () => {
    const ch = CGF.compareView.choose;
    const f1 = mkRun('s_f1', 'fixed', []), a1 = mkRun('s_a1', 'adaptive', []), f2 = mkRun('s_f2', 'fixed', []), a2 = mkRun('s_a2', 'adaptive', []);
    eq(ch([f1, a1, f2, a2], {}).run.session_id, 's_a2');
    eq(ch([f1, a1, f2, a2], {}).baseline.session_id, 's_f2', 'the latest fixed baseline');
    eq(ch([f1, a1, f2, a2], { run: 's_a1' }).run.session_id, 's_a1');
    eq(ch([f1, a1, f2, a2], { run: 's_a1', baseline: 's_f1' }).baseline.session_id, 's_f1', 'an explicit baseline wins');
    eq(ch([f1, a1], { run: 'nope' }).problem, 'missing-run');
    eq(ch([f1, a1], { run: 's_a1', baseline: 'nope' }).problem, 'missing-baseline');
    eq(ch([f1, a1], { run: 's_f1' }).problem, 'not-adaptive');
  });

  // ---- AI partner parameters (J7, INTERFACES §3.2)
  const entry = (sid, k, success, fail) => ({ session_id: sid, report: { facts: { events_by_competency: { [k]: { success, fail } } } } });
  const withHistory = (id, entries) => { CGF.History = { list: who => (who === id ? entries : []) }; };
  const SUCCESS_TYPES = ['hail_acknowledged', 'safe_passage', 'left_territorial', 'fc_restraint', 'pirate_speed_response'];

  test('partnerParams without history uses the profile mean where there is enough evidence, else 0.5', () => {
    const r = A.partnerParams({ trainee_id: 'trainee_b' });
    eq(Object.keys(r.rates).sort(), SUCCESS_TYPES.slice().sort());
    eq(r.rates.hail_acknowledged, A.means(A.profile('trainee_b')).hail_discipline);
    eq(r.basis.by_competency.hail_discipline, 'profile');
    eq([r.basis.source, r.basis.sessions], ['profile', 0]);
    eq(r.reaction_delay_s, A.DEFAULT_REACTION_DELAY_S);
  });
  test('partnerParams for an unknown trainee is all defaults', () => {
    const r = A.partnerParams({ trainee_id: 'trainee_new' });
    ok(SUCCESS_TYPES.every(t => r.rates[t] === 0.5), 'all 0.5');
    eq([r.basis.source, r.basis.sessions], ['default', 0]);
  });
  test('partnerParams prefers history: (successes + 1) / (events + 2), counting the sessions used', () => {
    withHistory('trainee_b', [entry('s_1', 'hail_discipline', 1, 5), entry('s_2', 'hail_discipline', 1, 3)]);
    const r = A.partnerParams({ trainee_id: 'trainee_b' });
    eq(r.rates.hail_acknowledged, 0.25);   // (2 + 1) / (10 + 2)
    eq([r.basis.source, r.basis.sessions, r.basis.by_competency.hail_discipline], ['history', 2, 'history']);
    eq(r.basis.by_competency.collision_avoidance, 'profile');   // no history for it: falls back to the profile
  });
  test('partnerParams can be limited to chosen sessions', () => {
    withHistory('trainee_b', [entry('s_1', 'hail_discipline', 1, 5), entry('s_2', 'hail_discipline', 1, 3)]);
    const r = A.partnerParams({ trainee_id: 'trainee_b', session_ids: ['s_2'] });
    eq(r.rates.hail_acknowledged, 0.33);   // (1 + 1) / (4 + 2)
    eq(r.basis.sessions, 1);
  });
  test('partnerParams ignores history with too few events', () => {
    withHistory('trainee_b', [entry('s_1', 'hail_discipline', 1, 1)]);   // 2 events, below the minimum of 3
    const r = A.partnerParams({ trainee_id: 'trainee_b' });
    eq(r.basis.by_competency.hail_discipline, 'profile');
    eq(r.basis.sessions, 0);
  });
  test('partnerParams is deterministic and keeps every rate between 0 and 1', () => {
    withHistory('trainee_a', [entry('s_1', 'hail_discipline', 9, 0), entry('s_2', 'weapons_discipline', 0, 9)]);
    const a = A.partnerParams({ trainee_id: 'trainee_a' }), b = A.partnerParams({ trainee_id: 'trainee_a' });
    eq(a, b);
    ok(Object.values(a.rates).every(x => x > 0 && x < 1), 'smoothed away from 0 and 1: ' + JSON.stringify(a.rates));
  });
  test('partnerParams needs a trainee id', () => {
    for (const bad of [null, {}, { trainee_id: '' }, { trainee_id: 5 }]) {
      let msg = ''; try { A.partnerParams(bad); } catch (e) { msg = e.message; }
      ok(/trainee_id/.test(msg), JSON.stringify(bad));
    }
  });

  reset();
  const failed = results.filter(r => r[1]);
  const s = document.getElementById('summary');
  s.textContent = `${results.length - failed.length} / ${results.length} passed`; s.className = failed.length ? 'fail' : 'pass';
  document.getElementById('results').innerHTML = results.map(([n, e]) =>
    `<li class="${e ? 'fail' : 'pass'}">${e ? 'FAIL' : 'PASS'} · ${n}${e ? ' — ' + e : ''}</li>`).join('');
})();
</script>
</body>
</html>
