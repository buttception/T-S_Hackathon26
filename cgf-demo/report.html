<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>End-of-training report</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="rp-page">
<main class="rp-main">
  <header class="rp-header">
    <h1>End-of-training report <small id="rpSub"></small></h1>
    <div class="row">
      <select id="rpTrainee" title="Open a trainee's latest report and history"></select>
      <button id="rpPrint">Print / save as PDF</button>
      <button id="rpExport">Export JSON</button>
      <a class="btn" href="allocate.html">Back to allocation</a>
    </div>
  </header>
  <div id="rpBody"><p class="muted">Loading…</p></div>
  <footer class="muted small rp-footer">
    Every figure is computed from the session record. The written summary is checked so that it contains no number
    absent from the report's facts. “After update” is the trainee's competency after the profile update for that session.
  </footer>
</main>

<!-- Contracts and seeded data (read only) -->
<script src="contracts/contracts.js"></script>
<script src="fixtures/profiles/roster.js"></script>
<script src="fixtures/history/demo.js"></script>
<!-- Report lane -->
<script src="js/report/report.js"></script>
<script src="js/history/history.js"></script>
<script src="js/ui-report.js"></script>
</body>
</html>
