<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Side-by-side run</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="link/host.css">
</head>
<body>
<div id="hostApp">
  <header>
    <h1>Run</h1>
    <span id="summary" class="grow"></span>
    <button id="btnStart" class="primary" disabled>Start</button>
    <button id="btnPause" disabled>Pause</button>
    <button id="btnRestart" disabled>Restart</button>
    <button id="btnExport" disabled title="Download the valid session records of this run as JSON">Export session records</button>
    <a class="btn" href="compare.html">Compare runs</a>
    <a class="btn" href="allocate.html">Edit allocation</a>
  </header>

  <div id="empty" hidden>
    <h2>No allocation to run</h2>
    <!-- The whole flow, with the current step marked in words as well as by class (design/requests.md R7) -->
    <ol class="flowSteps" aria-label="The steps of a training run">
      <li class="flowStep flowStep--current" aria-current="step"><b>1. Allocate</b> <span class="muted small">choose the platform and the crew · you are here</span></li>
      <li class="flowStep"><b>2. Run</b> <span class="muted small">watch the crew and the AI's adjustments</span></li>
      <li class="flowStep"><b>3. Report</b> <span class="muted small">debrief, competency update and a comparison with a baseline</span></li>
    </ol>
    <p id="emptyWhy" class="muted"></p>
    <p><a class="btn primary" href="allocate.html">Open the allocation page</a></p>
  </div>

  <main id="stage">
    <!-- One crew, one runtime (J8). The inline style spans the whole width; Eevee can move it into link/host.css, whose grid has two columns. -->
    <section class="pane" style="grid-column: 1 / -1"><div id="infoA" class="info"></div><iframe id="frameA" title="Runtime"></iframe></section>
  </main>
</div>

<script src="js/util.js"></script>
<script src="contracts/contracts.js"></script>
<script src="contracts/link.js"></script>
<!-- Glenda's report lane: when a pane's session record arrives, Report.finishSession builds the reports, appends the
     history entries and gives the report page URL. The host only calls it. -->
<script src="fixtures/profiles/roster.js"></script>
<script src="js/report/report.js"></script>
<script src="js/history/history.js"></script>
<script src="js/assess/assess.js"></script>
<script src="js/assess/runs.js"></script>
<script src="link/host.js"></script>
</body>
</html>
